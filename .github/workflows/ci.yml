name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      # tsc and scripts/build.mjs run on node, not bun. 22 is the floor the whole project agrees on: engines.vscode, @types/node, the esbuild target and lib.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # client/ and server/ are workspaces of the root package, so this is the only install and --frozen-lockfile covers all three.
      - run: bun install --frozen-lockfile

      # Regenerates the parser, type-checks both projects, then bundles.
      - run: bun run compile

      # Must be `bun run test`: bare `bun test` is Bun's own runner, which picks up the VS Code e2e fixtures and reports meaningless failures. The e2e suite has a job of its own below.
      - run: bun run test

  # The only thing that drives the LSP over the wire, and it is the flakiest thing here: it downloads VS Code and runs a real window under a virtual display. It reports rather than blocks, because the suite was red for two releases and nobody knew.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # `bun run e2e` compiles, bundles the suites and launches VS Code. xvfb-run gives the window a display; -a picks a free one.
      - run: xvfb-run -a bun run e2e
